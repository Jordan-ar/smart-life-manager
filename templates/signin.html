<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Sign In | Smart Fitness Planner</title>
		<link rel="stylesheet" href="/static/css/style.css">
		<link rel="stylesheet" href="/static/css/auth.css">
		<!-- Font Awesome for icons -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
		<script src="/static/js/script.js" defer></script>
	</head>

	<body>
		<!-- Main container-->
		<div class="welcome-container">
			<div class="welcome-card">
				<h1>Sign in to your account</h1>
				<p>Let's continue your fitness journey</p>
				<!-- Sign In Form -->
				<form method="POST" action="{{ url_for('signin') }}">
					<div>
						<label for="email" class="sr-only">Email</label>
						<input type="email" id="email" name="email" class="form-input" placeholder="Email" required>
					</div>

					<div class="password-group">
						<label for="password" class="sr-only">Password</label>
						<input type="password" id="password" name="password" class="form-input" placeholder="Password" required>
						<button type="button" class="toggle-password" aria-label="Toggle password visibility">
							<i class="fa-solid fa-eye"></i>
						</button>
					</div>

					<!-- Remember Me and Forgot Password Links -->
					<div class="form-options">
						<label class="text-checkbox">
							<input type="checkbox"> Remember me
						</label>
						<a href="{{ url_for('reset_password') }}" class="link">Forgot password?</a>
					</div>

					<!-- Sign In Button and Social Sign In Options -->
					<button type="submit" class="btn primary">Sign In</button>
					<div class="divider">
						<span>or</span>
					</div>
					<div class="buttons">
						<a href="{{ url_for('google.login') }}?prompt=select_account" class="btn secondary">
							<i class="fab fa-google icon"></i> Sign in with Google
						</a>
					</div>
					<!-- Bottom Text for Sign Up Link -->
					<p class="bottom-text">
						Don't have an account?
						<a href="{{ url_for('signup') }}" class="link">Sign Up</a>
					</p>
				</form>
			</div>
		</div>
	</body>
</html>
