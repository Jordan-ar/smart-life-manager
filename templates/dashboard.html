<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<script id="user-progress" type="application/json">
  					{{ progress | tojson | safe }}
		</script>
		<title>Dashboard | Smart Fitness Planner</title>
		<link rel="stylesheet" href="/static/css/style.css">
		<link rel="stylesheet" href="/static/css/dashboard.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	</head>

	<body>

		<div class="width-container">

			<!-- Header -->
			<div class="profile-section">
				<i class="fas fa-bolt icon-header"></i>
				<h1>Let's Workout</h1>
			</div>

			<!-- Workout + Activity Row -->
			<div class="section-two">
				<div class="card workout-progress-card">
					<div class="group-texts">
						<h2 class="progress-title">Workout Progress</h2>
						<p class="progress-subtext">5 exercises left</p>
					</div>
					<div class="donut-container">
						<svg class="donut" viewBox="0 0 36 36">
							<path class="donut-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
							<path class="donut-ring" stroke-dasharray="40, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
							<text x="18" y="20.5" class="donut-text">40%</text>
						</svg>
					</div>
				</div>

				<div class="card activity-card">
					<p class="card-title">Today's Activity</p>
					<div class="activity-summary">
						<div class="calories-box">
							<i class="fas fa-fire icon"></i>
							<p>400<br><small>calories</small></p>
						</div>
						<div class="activity-list"></div>
					</div>
				</div>
			</div>

			<!-- Statistics Summary -->
			<div class="section-two">
				<p class="section-title">Overall Status</p>
			</div>

			<!-- Total Calories Burned -->
			<div class="card overall-card">
				<div class="overall-icon">
					<i class="fas fa-fire-alt"></i>
				</div>

				<div class="group-texts">
					<p class="overall-title">Calories Burned</p>
					<p class="overall-number">10,000 kcal</p>
				</div>

				<!-- Donut percentage -->
				<div class="donut-container small">
					<svg class="donut" viewBox="0 0 36 36">
						<path class="donut-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
						<path class="donut-ring" stroke-dasharray="37, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
						<text x="18" y="20.5" class="donut-text">37%</text>
					</svg>
				</div>

			</div>

			<!-- Total goal that has been completed -->
			<div class="card overall-card">
				<div class="overall-icon">
					<i class="fas fa-weight icon"></i>
				</div>

				<div class="group-texts">
					<p class="overall-title">Weight Loss</p>
					<p class="overall-number">9 kg</p>
				</div>

				<!-- Donut percentage -->
				<div class="donut-container small">
					<svg class="donut" viewBox="0 0 36 36">
						<path class="donut-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
						<path class="donut-ring" stroke-dasharray="80, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
						<text x="18" y="20.5" class="donut-text">80%</text>
					</svg>
				</div>

			</div>

			<!-- Week Streak -->
			<div class="card streak-card">
				<p class="card-title">Keep going! Daily Streak</p>
				<div class="streak-stars">
					<i class="fas fa-star filled"></i>
					<i class="fas fa-star filled"></i>
					<i class="fas fa-star filled"></i>
					<i class="fas fa-star filled"></i>
					<i class="far fa-star"></i>
					<i class="far fa-star"></i>
				</div>
			</div>

			<!-- Nav Menu -->
			<nav class="bottom-nav">
				<a href="{{ url_for('home') }}"><i class="fas fa-home"></i></a>
				<a href="{{ url_for('calendar') }}"><i class="fas fa-calendar-alt"></i></a>
				<a href="{{ url_for('profile') }}"><i class="fas fa-user"></i></a>
			</nav>

		</div>
		<script>
			document.addEventListener("DOMContentLoaded", async () => {
				try {
					const res = await fetch("/dashboard-data");
					const data = await res.json();

					if (!data.success) throw new Error(data.error || "Failed to load data");

					// Workout progress
					const percent = data.percentage_today;
					document.querySelector(".donut-ring").setAttribute("stroke-dasharray", `${percent}, 100`);
					document.querySelector(".donut-text").textContent = `${percent}%`;
					document.querySelector(".progress-subtext").textContent =
						data.total_today - data.today_completed.length > 0
							? `${data.total_today - data.today_completed.length} exercises left`
							: `Workout complete!`;

					// Today's Activity
					document.querySelector(".calories-box p").innerHTML = `${data.calories_today}<br><small>calories</small>`;

					const activityList = document.querySelector(".activity-list");
					const previewExercises = data.today_exercises.slice(0, 5);
					activityList.innerHTML = "";
					previewExercises.forEach(ex => {
						const item = document.createElement("div");
						item.classList.add("activity-item");
						item.innerHTML = `<span>${ex}</span><span>✔</span>`;
						activityList.appendChild(item);
					});
					const link = document.createElement("a");
					link.href = "/calendar";
					link.className = "link small-link";
					link.textContent = "View full routine →";
					activityList.appendChild(link);

					// Calories Burned total
					document.querySelectorAll(".overall-number")[0].textContent = `${data.calories_total} kcal`;
					document.querySelectorAll(".donut-ring")[1].setAttribute("stroke-dasharray", `${Math.min(100, data.calories_total / 3000 * 100)}, 100`);
					document.querySelectorAll(".donut-text")[1].textContent = `${Math.min(100, Math.round(data.calories_total / 3000 * 100))}%`;

					// Weight Progress
					document.querySelectorAll(".overall-number")[1].textContent = `${data.weight_progress.toFixed(0)}%`;
					document.querySelectorAll(".donut-ring")[2].setAttribute("stroke-dasharray", `${data.weight_progress}, 100`);
					document.querySelectorAll(".donut-text")[2].textContent = `${data.weight_progress.toFixed(0)}%`;

					// Streak stars
					const streakContainer = document.querySelector(".streak-stars");
					streakContainer.innerHTML = "";
					for (let i = 0; i < data.streak_target; i++) {
						const star = document.createElement("i");
						star.className = i < data.streak_count ? "fas fa-star filled" : "far fa-star";
						streakContainer.appendChild(star);
					}
				} catch (err) {
					console.error("Dashboard error:", err);
				}
			});
		</script>
	</body>
</html>
