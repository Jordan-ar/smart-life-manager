<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Set New Password | Smart Fitness Planner</title>
	<link rel="stylesheet" href="/static/css/style.css" />
	<link rel="stylesheet" href="/static/css/auth.css" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
	<div class="welcome-container">
		<div class="welcome-card">
			<h1>Create a New Password</h1>
			<p>Enter and confirm your new password below</p>

			<form method="POST">
				<!-- New Password -->
				<div class="password-group">
					<label for="password" class="sr-only">New Password</label>
					<input type="password" id="password" name="password" class="form-input" placeholder="New Password" required>
					<button type="button" class="toggle-password" aria-label="Toggle password visibility">
						<i class="fa-solid fa-eye"></i>
					</button>
				</div>

				<!-- Confirm Password -->
				<div class="password-group">
					<label for="confirm-password" class="sr-only">Confirm Password</label>
					<input type="password" id="confirm-password" name="confirm_password" class="form-input" placeholder="Confirm Password" required>
					<button type="button" class="toggle-password" aria-label="Toggle password visibility">
						<i class="fa-solid fa-eye"></i>
					</button>
				</div>

				<button type="submit" class="btn primary full-btn">Update Password</button>

				<p class="bottom-text">
					Back to
					<a href="{{ url_for('signin') }}" class="link">Sign In</a>
				</p>
			</form>
		</div>
	</div>

	<script>
		document.querySelectorAll(".toggle-password").forEach(button => {
			button.addEventListener("click", () => {
				const input = button.previousElementSibling;
				input.type = input.type === "password" ? "text" : "password";
				button.querySelector("i").classList.toggle("fa-eye");
				button.querySelector("i").classList.toggle("fa-eye-slash");
			});
		});
	</script>
</body>
</html>
