<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Training Plan | Smart Fitness Planner</title>

		<link rel="stylesheet" href="/static/css/style.css">
		<link rel="stylesheet" href="/static/css/main-pages.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

		<!-- Inject user plan -->
		<script id="user-plan" type="application/json">
		{{ user_plan | tojson | safe }}
	</script>

		<script id="user-id" type="application/json">
			{{ user_id | tojson | safe }}
		</script>

		<!-- Inject user progress -->
		<script id="user-progress" type="application/json">
		{{ progress | tojson | safe }}
	</script>

		<!-- Parse both into JS variables -->
		<script>
			const userPlan = JSON.parse(document.getElementById('user-plan').textContent);
			const progressData = JSON.parse(document.getElementById('user-progress').textContent);
		</script>

		<script src="/static/js/calendar.js" defer></script>
	</head>

	<body>
		<div class="width-container">

			<!-- Header -->
			<div>
				<h1>My Training Plan</h1>
				<p id="plan-subtitle">Weekly Routine</p>
			</div>

			<!-- Week calendar -->
			<div class="week-bar" id="week-bar">
				<div class="day-circle active" data-day="Mon">M</div>
				<div class="day-circle" data-day="Tue">T</div>
				<div class="day-circle" data-day="Wed">W</div>
				<div class="day-circle" data-day="Thu">T</div>
				<div class="day-circle" data-day="Fri">F</div>
				<div class="day-circle" data-day="Sat">S</div>
				<div class="day-circle" data-day="Sun">S</div>
			</div>

			<!-- Workout of the day -->
			<div class="card" id="day-card">
				<p class="card-title"><i class="fas fa-fire"></i> Fat Burn · Today</p>
				<p class="card-sub">The fat burn workout. Blasts calories and boosts endurance.</p>
				<div class="tab-container">
					<button class="tab-button active" data-target="warmup-section">Warm-up</button>
					<button class="tab-button" data-target="circuit-section">Circuit</button>
					<button class="tab-button" data-target="cooldown-section">Cool down</button>
				</div>

				<h4 class="exercise-title">Exercises</h4>
				<div id="warmup-section" class="exercise-tab"></div>
				<div id="circuit-section" class="exercise-tab hidden"></div>
				<div id="cooldown-section" class="exercise-tab hidden"></div>



				<p id="completion-message">
					All workouts completed for today!
				</p>
			</div>

		</div>

		<!-- Exercise explanation-->
		<div id="exercise-modal" class="modal hidden">
			<div class="modal-content">
				<span class="close-modal">&times;</span>
				<h3 id="modal-exercise-name" class="modal-exercise-title">Exercise Name</h3>
				<p id="modal-exercise-description" class="modal-description">Exercise description will go here.</p>
			</div>
		</div>

		<!-- Nav Menu -->
		<nav class="bottom-nav">
			<a href="{{ url_for('calendar') }}"><i class="fas fa-calendar-alt"></i></a>
			<a href="{{ url_for('profile') }}"><i class="fas fa-user"></i></a>
		</nav>
	</body>
</html>
