<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Sign In | Smart Fitness Planner</title>
		<link rel="stylesheet" href="/static/style.css">
		<!-- Font Awesome for icons -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
		<script src="/static/script.js" defer></script>
	</head>

	<body>
		<!-- Main container-->
		<div class="welcome-container">
			<div class="welcome-card">
				<h1>Create your account</h1>
				<p>Let's begin your transformation</p>
				<!-- Sign In Form -->
				<form>
					<!-- Name and Email Fields -->
					<div>
						<label for="name" class="sr-only">Name</label>
						<input type="text" id="name" class="form-input" placeholder="Name" required>
					</div>

					<div>
						<label for="email" class="sr-only">Email</label>
						<input type="email" id="email" class="form-input" placeholder="Email" required>
					</div>

					<!-- Password Fields with Toggle Visibility -->
					<div class="password-group">
						<label for="password" class="sr-only">Password</label>
						<input type="password" id="password" class="form-input" placeholder="Password" required>
						<!-- Toggle Password Visibility -->
						<button type="button" class="toggle-password" aria-label="Toggle password visibility">
							<i class="fa-solid fa-eye"></i>
						</button>
					</div>

					<div class="password-group">
						<label for="password" class="sr-only">Password</label>
						<input type="password" id="confirm-password" class="form-input" placeholder="Confirm Password" required>
						<!-- Toggle Password Visibility -->
						<button type="button" class="toggle-password" aria-label="Toggle password visibility">
							<i class="fa-solid fa-eye"></i>
						</button>
					</div>

					<!-- Form Options -->
					<div class="form-options">
						<label class="text-checkbox">
							<input type="checkbox"> I accept the
							<a href="#" class="link">terms and conditions</a>
						</label>
					</div>

					<!-- Sign Up Button-->
					<button type="button" class="btn primary" id="signup-btn">Create Account</button>

					<!-- Divider -->
					<div class="divider">
						<span>or</span>
					</div>

					<!-- Social Sign Up Options -->
					<div class="buttons">
						<a href="#" class="btn secondary">
							<i class="fab fa-google icon"></i> Continue with Google
						</a>
						<a href="#" class="btn secondary">
							<i class="fab fa-microsoft icon"></i> Continue with Microsoft
						</a>
					</div>

					<!-- Bottom Text for Sign In Link -->
					<p class="bottom-text">
						Already have an account?
						<a href="/templates/signin.html" class="link">Sign In</a>
					</p>
				</form>
			</div>
		</div>
	</body>
</html>
