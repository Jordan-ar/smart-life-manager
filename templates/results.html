<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Plan Ready | Smart Fitness Planner</title>
		<link rel="stylesheet" href="/static/css/style.css">
		<link rel="stylesheet" href="/static/css/auth.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
		<script src="/static/js/script.js" defer></script>
	</head>

	<body>

		<div class="welcome-container">
			<div id="plan-ready-screen" class="welcome-card">
				<h1> <i class="fas fa-check-circle icon"></i> Your Plan is Ready!</h1>
				<div class="buttons">
					<div class="option-btn selected">
						<i class="fas fa-hourglass-half"></i> Duration: {{ duration }} weeks
					</div>
					<div class="option-btn selected">
						<i class="fas fa-bullseye"></i> Goal: Lose {{ weight_goal }} kg
					</div>
					<div class="option-btn selected">
						<i class="fas fa-calendar-check"></i> Frequency: {{ days }}x / week
					</div>
					<div class="option-btn selected">
						<i class="fas fa-stopwatch"></i> Time: {{ time }} mins/day
					</div>
				</div>
				<a href="{{ url_for('home') }}" id="start-plan-btn" class="btn primary full-btn">Start My Plan</a>
			</div>
		</div>

	</body>
</html>
