<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Reset Password | Smart Fitness Planner</title>
		<link rel="stylesheet" href="/static/css/style.css">
		<link rel="stylesheet" href="/static/css/auth.css">
		<!-- Font Awesome for icons -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	</head>

	<body>
		<div class="welcome-container">
			<div class="welcome-card">
				<h1>Reset Password</h1>
				<p>We'll send instructions to your email</p>

				<form>
					<label for="email" class="sr-only">Email</label>
					<input type="email" id="email" class="form-input" placeholder="Enter your email" required>

					<button type="submit" class="btn primary full-btn">Send Reset Link</button>

					<p class="bottom-text">
						Remembered your password?
						<a href="/templates/signin.html" class="link">Sign In</a>
					</p>
				</form>
			</div>
		</div>
	</body>
</html>
